# Guild.ai experiment config (PRD §9.3).
# Runs the pipeline over the frozen benchmark for a given corpus version and
# logs P/R/F1 scalars so runs are comparable and the F1-over-versions chart
# can be exported.
#
#   guild run bench corpus_version=v0
#   guild run bench corpus_version=v1
#   guild run bench corpus_version=v2
#   guild compare            # F1 across versions -> the money chart

- model: firevolv
  operations:
    bench:
      description: Evaluate Firevolv over the frozen benchmark at one corpus version.
      # Run the real in-place script from the repo root instead of Guild's copied
      # sandbox: run_bench.py bootstraps its own sys.path from __file__, and
      # pydantic-settings loads .env relative to CWD, so both need the repo root.
      # (Guild's default sandbox run breaks `from eval.seeds import ...`.)
      # Portable: Guild sets $PROJECT_DIR to this guildfile's dir (eval/), so the
      # repo root is $PROJECT_DIR/..; `python` resolves to the active env (run
      # inside the `guild` conda env — see eval/setup_guild_env.sh).
      exec: bash -c 'cd "$PROJECT_DIR/.." && python eval/run_bench.py --version ${corpus_version}'
      flags:
        corpus_version:
          description: Seeded corpus state (v0 empty, v1 = 5 labels, v2 = 15 labels)
          default: v0
          choices: [v0, v1, v2]
      output-scalars:
        - 'P=(?P<precision>\value)'
        - 'R=(?P<recall>\value)'
        - 'F1=(?P<f1>\value)'
        - 'acc=(?P<accuracy>\value)'
      requires:
        - file: ../benchmark/firevolv_bench.jsonl
        - file: ../backend
